
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERSTAR SHOWDOWN</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#080b16;color:white;font-family:Arial;touch-action:manipulation}
button,input,select{font:inherit}
button{border:2px solid #ffffff55;border-radius:15px;padding:13px;color:white;font-weight:900;background:linear-gradient(135deg,#f13c45,#870b1b);box-shadow:0 5px 15px #0009;touch-action:manipulation}
button:active{transform:scale(.94)}
input,select{width:100%;padding:14px;border-radius:10px;background:#151b2c;color:white;margin:6px 0 13px}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
header{text-align:center;padding:6px;background:linear-gradient(90deg,#11182a,#45121c,#11182a);border-bottom:2px solid #d7a33c}
header h1{margin:0;color:#ffd36b;font-size:clamp(19px,4vw,30px)}
header small{font-size:9px;letter-spacing:3px}
#status{text-align:center;padding:5px;color:#ffd36b;font-size:12px;font-weight:bold;min-height:24px}
#lobby{width:min(94%,480px);max-height:calc(100dvh - 70px);overflow-y:auto;margin:8px auto;padding:18px;background:#141b2b;border:1px solid #454d65;border-radius:17px}
#lobby h2{text-align:center;color:#ffd36b}
label{font-size:12px;color:#cbd1df}
#roomInfo{text-align:center;color:#ffd36b;margin:10px}
#copyBtn,#startBtn{width:100%;margin-top:8px}
#copyBtn{background:#263650}
#startBtn{background:linear-gradient(135deg,#1aaf64,#08723b)}
.hidden{display:none!important}
#battle{display:none;flex:1;min-height:0;position:relative;overflow:hidden;flex-direction:column}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 12px;background:#101827;z-index:2}
.playerHud{min-width:0}
.playerHud:last-child{text-align:right}
.playerName{font-size:14px;font-weight:900;color:#ffd36b}
.bar{height:11px;background:#343b4c;border-radius:20px;overflow:hidden;margin:4px 0}
.hp{height:100%;width:100%;background:linear-gradient(90deg,#19c65a,#a7ff5c);transition:width .18s}
.charge{height:100%;width:0;background:linear-gradient(90deg,#168aff,#56eaff)}
#arenaWrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#080b16}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
#joystick{position:absolute;z-index:5;left:18px;bottom:18px;width:142px;height:142px;border-radius:50%;background:#ffffff38;border:4px solid #ffffffbb;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 5px 22px #000b}
#stick{width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#fff,#8295b5);border:4px solid #34445c;box-shadow:0 4px 15px #000b;pointer-events:none}
#actionPad{position:absolute;z-index:5;right:16px;bottom:17px;display:grid;grid-template-columns:repeat(2,minmax(100px,120px));gap:10px}
#actionPad button{min-height:65px;padding:8px 5px;font-size:14px;border-radius:17px}
.block{background:linear-gradient(135deg,#2476c8,#12376c)}
.release{background:linear-gradient(135deg,#3a465e,#202a3d)}
.special{background:linear-gradient(135deg,#d18aff,#6421a8)}
#fullBtn{position:absolute;z-index:7;right:12px;top:10px;background:#111c30dd;padding:9px 13px;font-size:20px}
@media(orientation:landscape) and (max-height:500px){
 header{display:none}
 #status{font-size:9px;padding:2px;min-height:15px}
 .hud{padding:3px 12px}
 .playerName{font-size:11px}
 .bar{height:7px;margin:2px 0}
 #hpText0,#hpText1,#chargeText0,#chargeText1{font-size:9px}
 #joystick{width:112px;height:112px;left:12px;bottom:9px}
 #stick{width:49px;height:49px}
 #actionPad{right:10px;bottom:9px;grid-template-columns:repeat(2,100px);gap:5px}
 #actionPad button{min-height:48px;font-size:11px}
 #fullBtn{top:4px;right:5px;padding:5px 8px}
}
@media(max-width:380px){
 #joystick{width:115px;height:115px}
 #stick{width:50px;height:50px}
 #actionPad{grid-template-columns:repeat(2,88px);gap:6px}
 #actionPad button{min-height:53px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
<header><h1>🥊 SUPERSTAR SHOWDOWN 🥊</h1><small>THE BOLLYWOOD BOXING CHAMPIONSHIP</small></header>
<div id="status">CONNECTING TO SERVER...</div>

<section id="lobby">
<h2>🔥 ENTER THE ARENA 🔥</h2>
<label>YOUR NAME</label>
<input id="playerName" maxlength="16" placeholder="Enter your name">
<label>CHOOSE YOUR SUPERSTAR</label>
<select id="character">
<option value="Salman Khan">Salman Khan — Bhaijaan Power</option>
<option value="Shah Rukh Khan">Shah Rukh Khan — King Khan Power</option>
<option value="Amitabh Bachchan">Amitabh Bachchan — Big B Power</option>
</select>
<button style="width:100%" onclick="createRoom()">🔥 CREATE ROOM</button>
<p style="text-align:center;color:#8993a9">— OR JOIN YOUR FRIEND —</p>
<label>ROOM CODE</label>
<input id="joinCode" maxlength="8" placeholder="Enter room code">
<button style="width:100%" onclick="joinRoom()">⚔️ JOIN ROOM</button>
<div id="roomInfo"></div>
<button id="copyBtn" class="hidden" onclick="copyCode()">📋 COPY ROOM CODE</button>
<button id="startBtn" class="hidden" onclick="startMatch()">🥊 START FIGHT</button>
</section>

<section id="battle">
<div class="hud">
<div class="playerHud">
<div class="playerName" id="name0">PLAYER 1</div>
<div class="bar"><div class="hp" id="hp0"></div></div>
<div id="hpText0">100 HP</div>
<div class="bar"><div class="charge" id="charge0"></div></div>
<small id="chargeText0">SUPERPOWER 0%</small>
</div>
<div class="playerHud">
<div class="playerName" id="name1">PLAYER 2</div>
<div class="bar"><div class="hp" id="hp1"></div></div>
<div id="hpText1">100 HP</div>
<div class="bar"><div class="charge" id="charge1"></div></div>
<small id="chargeText1">SUPERPOWER 0%</small>
</div>
</div>
<div id="arenaWrap">
<canvas id="game" width="960" height="540"></canvas>
<button id="fullBtn" onclick="enterFullscreen()">⛶</button>
<div id="joystick"><div id="stick"></div></div>
<div id="actionPad">
<button onclick="doAction('punch')">👊 PUNCH</button>
<button class="block" onclick="doAction('block')">🛡 BLOCK</button>
<button class="release" onclick="doAction('release')">RELEASE</button>
<button class="special" onclick="doAction('special')">⚡ POWER</button>
</div>
</div>
</section>
</div>

<script>
const $=id=>document.getElementById(id);
let connected=false,roomCode="",mySlot=0,gameState=null,lastWinner=null;

async function enterFullscreen(){
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
  if(screen.orientation?.lock)await screen.orientation.lock("landscape");
 }catch(e){}
}

const socket=io({transports:["polling"],reconnection:true,timeout:20000});

socket.on("connect",()=>{connected=true;say("🟢 CONNECTED TO SERVER")});
socket.on("disconnect",()=>{connected=false;say("🔴 DISCONNECTED — RECONNECTING...")});
socket.on("connect_error",e=>{connected=false;say("CONNECTION ERROR: "+e.message)});
socket.on("joined",d=>{
 roomCode=d.code||roomCode;mySlot=Number(d.slot||0);
 $("roomInfo").textContent="ROOM CODE: "+roomCode;
 $("copyBtn").classList.remove("hidden");
 $("startBtn").classList.remove("hidden");
 say("ROOM JOINED! WAITING FOR OPPONENT...");
});
socket.on("errorMessage",say);

socket.on("state",s=>{
 if(!s)return;
 gameState=s;
 if(s.started){
  $("lobby").classList.add("hidden");
  $("battle").style.display="flex";
 }
 updateHUD(s);
 if(s.winner){
  say("🏆 "+s.winner+" WINS!");
  if(lastWinner!==s.winner){playSound("defeat");lastWinner=s.winner}
 }else{
  lastWinner=null;
  if(s.message)say(s.message);
 }
});

function say(t){$("status").textContent=t}

function createRoom(){
 unlockAudio();enterFullscreen();
 if(!connected)return say("SERVER CONNECTING — WAIT A MOMENT");
 const name=$("playerName").value.trim();
 if(!name)return say("PLEASE ENTER YOUR NAME");
 socket.emit("createRoom",{name,character:$("character").value});
 say("CREATING ROOM...");
}

function joinRoom(){
 unlockAudio();enterFullscreen();
 if(!connected)return say("SERVER CONNECTING — WAIT A MOMENT");
 const name=$("playerName").value.trim(),code=$("joinCode").value.trim().toUpperCase();
 if(!name)return say("PLEASE ENTER YOUR NAME");
 if(!code)return say("ENTER ROOM CODE");
 socket.emit("joinRoom",{code,name,character:$("character").value});
 say("JOINING ROOM...");
}

function startMatch(){
 unlockAudio();enterFullscreen();
 if(connected)socket.emit("startMatch");
 else say("NOT CONNECTED");
}

function copyCode(){
 if(!roomCode)return;
 navigator.clipboard?.writeText(roomCode).then(()=>say("ROOM CODE COPIED!")).catch(()=>say("ROOM CODE: "+roomCode));
}

/* SOUND FILES */
const sounds={
 salman:new Audio("/le-re-lund-ke.mp3"),
 shah:new Audio("/shahrukh-khan-call.mp3"),
 amitabh:new Audio("/ma-ka-bhosda-aag.mp3"),
 punch:new Audio("/punch.mp3"),
 defeat:new Audio("/defeat.mp3")
};
Object.values(sounds).forEach(a=>{a.preload="auto";a.volume=1});

let audioUnlocked=false;
function unlockAudio(){
 if(audioUnlocked)return;
 audioUnlocked=true;
 Object.values(sounds).forEach(a=>{
  try{
   a.muted=true;
   const p=a.play();
   if(p)p.then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false});
   else a.muted=false;
  }catch(e){a.muted=false}
 });
}
document.addEventListener("pointerdown",unlockAudio,{once:true});

function playSound(name){
 const source=sounds[name];
 if(!source)return;
 try{
  const a=source.cloneNode();
  a.volume=1;
  a.play().catch(e=>console.log("Audio blocked",e));
 }catch(e){}
}

socket.on("combatEvent",e=>{
 if(!e)return;
 if(e.type==="punch")playSound("punch");
 if(e.type==="special"){
  if(e.character==="Salman Khan")playSound("salman");
  if(e.character==="Shah Rukh Khan")playSound("shah");
  if(e.character==="Amitabh Bachchan")playSound("amitabh");
 }
});

function doAction(type){
 if(!connected)return say("RECONNECTING...");
 unlockAudio();
 socket.emit("action",type);
}

function updateHUD(s){
 (s.players||[]).forEach((p,i)=>{
  if(i>1)return;
  const hp=Math.max(0,Number(p.hp??100));
  const charge=Math.max(0,Math.min(100,Number(p.charge||0)));
  $("name"+i).textContent=p.name||p.character||"PLAYER "+(i+1);
  $("hp"+i).style.width=hp+"%";
  $("hpText"+i).textContent=hp+" HP";
  $("charge"+i).style.width=charge+"%";
  $("chargeText"+i).textContent="SUPERPOWER "+charge+"%";
 });
}

/* FIGHTER DRAWING */
const canvas=$("game"),ctx=canvas.getContext("2d");
const arenaImage=new Image();arenaImage.src="/arena.png";
const fighterImage=new Image();fighterImage.src="/characters/fighters.png";
const visual={};

function drawFighter(p,i){
 const id=p.id||String(i);
 if(!visual[id])visual[id]={x:Number(p.x??(i?75:25))};

 const v=visual[id];
 const target=Number(p.x??(i?75:25));
 v.x+=(target-v.x)*0.24;

 const x=48+(v.x/100)*864;
 const ground=420;
 let jumpHeight=0;

 if(p.jumping && p.jumpStartedAt){
  const t=Math.min(1,Math.max(0,(Date.now()-p.jumpStartedAt)/650));
  jumpHeight=Math.sin(t*Math.PI)*125;
 }

 const y=ground-jumpHeight;
 const facing=p.facing||(i===0?1:-1);
 const character=p.character||"";
 const spriteIndex=character.includes("Shah")?1:character.includes("Amitabh")?2:0;

 ctx.save();
 ctx.fillStyle="#0009";
 ctx.beginPath();
 ctx.ellipse(x,ground,48,11,0,0,Math.PI*2);
 ctx.fill();

 ctx.translate(x,y);
 ctx.scale(facing,1);

 if(p.crouching){
  ctx.translate(0,-25);
  ctx.scale(1,0.72);
 }

 if(fighterImage.complete&&fighterImage.naturalWidth>0){
  const sw=fighterImage.naturalWidth/3,sh=fighterImage.naturalHeight;
  ctx.drawImage(fighterImage,spriteIndex*sw,0,sw,sh,-65,-165,130,165);
 }else{
  ctx.fillStyle=i===0?"#d92d3a":"#277bd6";
  ctx.fillRect(-35,-115,70,115);
  ctx.beginPath();ctx.arc(0,-135,28,0,Math.PI*2);ctx.fill();
 }

 if(p.blocking){
  ctx.strokeStyle="#39c9ff";ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(0,-80,75,-1.4,1.4);ctx.stroke();
 }

 if(p.attacking){
  ctx.strokeStyle="#ffdc62";ctx.lineWidth=13;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(25,-90);ctx.lineTo(105,-105);ctx.stroke();
 }

 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,960,540);
 if(arenaImage.complete&&arenaImage.naturalWidth>0){
  ctx.drawImage(arenaImage,0,0,960,540);
 }else{
  const g=ctx.createLinearGradient(0,0,0,540);
  g.addColorStop(0,"#18243c");g.addColorStop(1,"#090d18");
  ctx.fillStyle=g;ctx.fillRect(0,0,960,540);
  ctx.fillStyle="#d6a13b";ctx.fillRect(0,420,960,5);
  ctx.fillStyle="#222d42";ctx.fillRect(0,425,960,115);
 }
 if(gameState?.players)gameState.players.forEach(drawFighter);
 else{
  drawFighter({id:"demo1",character:"Salman Khan",x:25},0);
  drawFighter({id:"demo2",character:"Shah Rukh Khan",x:75},1);
 }
 requestAnimationFrame(draw);
}

/* JOYSTICK: LEFT/RIGHT, UP=JUMP, DOWN=CROUCH */
const joy=$("joystick"),stick=$("stick");
let joyActive=false,joyDX=0,joyDY=0;
let jumpPending=false,crouch=false;

function updateJoystick(e){
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 let dx=e.clientX-cx,dy=e.clientY-cy;
 const max=r.width*0.34,dist=Math.hypot(dx,dy);
 if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
 stick.style.transform=`translate(${dx}px,${dy}px)`;
 joyDX=Math.abs(dx)<10?0:dx/max;
 joyDY=Math.abs(dy)<10?0:dy/max;
}

joy.addEventListener("pointerdown",e=>{
 unlockAudio();joyActive=true;
 joy.setPointerCapture(e.pointerId);
 updateJoystick(e);
});

joy.addEventListener("pointermove",e=>{
 if(joyActive)updateJoystick(e);
});

function stopJoystick(){
 joyActive=false;joyDX=0;joyDY=0;
 jumpPending=false;crouch=false;
 stick.style.transform="translate(0,0)";
 if(connected)socket.emit("move",{dx:0,crouch:false});
}

joy.addEventListener("pointerup",stopJoystick);
joy.addEventListener("pointercancel",stopJoystick);

let wasUp=false;
setInterval(()=>{
 if(!connected||!joyActive)return;

 const up=joyDY < -0.38;
 const down=joyDY > 0.38;

 if(up&&!wasUp)jumpPending=true;
 wasUp=up;
 crouch=down;

 socket.emit("move",{
  dx:joyDX,
  jump:jumpPending,
  crouch
 });
 jumpPending=false;
},70);

/* KEYBOARD: A/D MOVE, W JUMP, S CROUCH */
const keys={};
window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(keys[k])return;
 keys[k]=true;
 if(k==="j")doAction("punch");
 if(k==="k")doAction("block");
 if(k==="l")doAction("release");
 if(k==="i")doAction("special");
});
window.addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();
 keys[k]=false;
 if(k==="k")doAction("release");
});

setInterval(()=>{
 if(!connected)return;
 const dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 const jump=!!(keys.w||keys.arrowup);
 const crouch=!!(keys.s||keys.arrowdown);
 if(dx||jump||crouch)socket.emit("move",{dx,jump,crouch});
},70);

draw();
</script>
</body>
 </html>
