
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERSTAR SHOWDOWN</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;height:100dvh;
 overflow:hidden;background:#080b16;color:white;
 font-family:Arial,sans-serif;touch-action:manipulation;
}
button,input,select{font:inherit}
button{
 border:2px solid #ffffff55;border-radius:15px;
 padding:13px;color:white;font-weight:900;
 background:linear-gradient(135deg,#f13c45,#870b1b);
 cursor:pointer;touch-action:manipulation;
 box-shadow:0 5px 15px #0009;
}
button:active{transform:scale(.94);filter:brightness(1.3)}
input,select{
 width:100%;padding:14px;border-radius:10px;
 border:1px solid #59627b;background:#151b2c;
 color:white;margin:6px 0 13px;
}
#app{
 width:100%;height:100%;height:100dvh;
 display:flex;flex-direction:column;overflow:hidden;
}
header{
 flex-shrink:0;text-align:center;padding:6px;
 background:linear-gradient(90deg,#11182a,#45121c,#11182a);
 border-bottom:2px solid #d7a33c;
}
header h1{margin:0;color:#ffd36b;font-size:clamp(19px,4vw,30px)}
header small{font-size:9px;letter-spacing:3px}
#status{
 flex-shrink:0;text-align:center;padding:5px;
 color:#ffd36b;font-size:12px;font-weight:bold;
 min-height:24px;
}
#lobby{
 width:min(94%,480px);max-height:calc(100dvh - 70px);
 overflow-y:auto;margin:8px auto;padding:18px;
 background:#141b2b;border:1px solid #454d65;
 border-radius:17px;box-shadow:0 10px 40px #0009;
}
#lobby h2{text-align:center;color:#ffd36b;margin:0 0 15px}
label{font-size:12px;color:#cbd1df}
#roomInfo{text-align:center;color:#ffd36b;margin:10px}
#copyBtn,#startBtn{width:100%;margin-top:8px}
#copyBtn{background:#263650}
#startBtn{background:linear-gradient(135deg,#1aaf64,#08723b)}
.hidden{display:none!important}

#battle{
 display:none;flex:1 1 0;min-height:0;
 position:relative;overflow:hidden;flex-direction:column;
}
.hud{
 flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;
 gap:12px;padding:6px 12px;background:#101827;z-index:2;
}
.playerHud{min-width:0}
.playerHud:last-child{text-align:right}
.playerName{font-size:14px;font-weight:900;color:#ffd36b}
.bar{
 height:11px;background:#343b4c;border-radius:20px;
 overflow:hidden;margin:4px 0;
}
.hp{
 height:100%;width:100%;
 background:linear-gradient(90deg,#19c65a,#a7ff5c);
 transition:width .18s;
}
.charge{
 height:100%;width:0;background:linear-gradient(90deg,#168aff,#56eaff);
 transition:width .18s;
}
#arenaWrap{
 position:relative;flex:1 1 0;min-height:0;
 overflow:hidden;background:#080b16;
}
#game{
 position:absolute;inset:0;width:100%;height:100%;
 display:block;z-index:1;
}

/* BIG JOYSTICK */
#joystick{
 position:absolute;z-index:5;left:18px;bottom:18px;
 width:142px;height:142px;border-radius:50%;
 background:#ffffff38;border:4px solid #ffffffbb;
 display:flex;align-items:center;justify-content:center;
 touch-action:none;box-shadow:0 5px 22px #000b;
}
#stick{
 width:62px;height:62px;border-radius:50%;
 background:linear-gradient(145deg,#fff,#8295b5);
 border:4px solid #34445c;
 box-shadow:0 4px 15px #000b;pointer-events:none;
}

/* BIG ACTION BUTTONS */
#actionPad{
 position:absolute;z-index:5;right:16px;bottom:17px;
 display:grid;grid-template-columns:repeat(2, minmax(100px,120px));
 gap:10px;
}
#actionPad button{
 min-height:65px;padding:8px 5px;font-size:14px;
 border-radius:17px;
}
#actionPad .block{background:linear-gradient(135deg,#2476c8,#12376c)}
#actionPad .release{background:linear-gradient(135deg,#3a465e,#202a3d)}
#actionPad .special{
 background:linear-gradient(135deg,#d18aff,#6421b9);
 border-color:#f2caff;
}
#fullBtn{
 position:absolute;z-index:7;right:12px;top:10px;
 background:#111c30dd;padding:9px 13px;
 font-size:20px;border-radius:10px;
}
@media (orientation:landscape) and (max-height:500px){
 header{display:none}
 #status{font-size:9px;padding:2px;min-height:15px}
 .hud{padding:3px 12px}
 .playerName{font-size:11px}
 .bar{height:7px;margin:2px 0}
 #hpText0,#hpText1,#chargeText0,#chargeText1{font-size:9px}
 #joystick{width:112px;height:112px;left:12px;bottom:9px}
 #stick{width:49px;height:49px}
 #actionPad{
  right:10px;bottom:9px;
  grid-template-columns:repeat(2,100px);gap:5px;
 }
 #actionPad button{min-height:48px;font-size:11px}
 #fullBtn{top:4px;right:5px;padding:5px 8px}
}
@media (max-width:380px){
 #joystick{width:115px;height:115px}
 #stick{width:50px;height:50px}
 #actionPad{grid-template-columns:repeat(2,88px);gap:6px}
 #actionPad button{min-height:53px;font-size:11px}
}
</style>
</head>

<body>
<div id="app">
<header>
 <h1>🥊 SUPERSTAR SHOWDOWN 🥊</h1>
 <small>THE BOLLYWOOD BOXING CHAMPIONSHIP</small>
</header>

<div id="status">CONNECTING TO SERVER...</div>

<section id="lobby">
 <h2>🔥 ENTER THE ARENA 🔥</h2>
 <label>YOUR NAME</label>
 <input id="playerName" maxlength="16" placeholder="Enter your name">

 <label>CHOOSE YOUR SUPERSTAR</label>
 <select id="character">
  <option value="Salman Khan">Salman Khan — Bhaijaan Power</option>
  <option value="Shah Rukh Khan">Shah Rukh Khan — King Khan Power</option>
  <option value="Amitabh Bachchan">Amitabh Bachchan — Big B Power</option>
 </select>

 <button style="width:100%" onclick="createRoom()">🔥 CREATE ROOM</button>
 <p style="text-align:center;color:#8993a9">— OR JOIN YOUR FRIEND —</p>

 <label>ROOM CODE</label>
 <input id="joinCode" maxlength="8" placeholder="Enter room code">
 <button style="width:100%" onclick="joinRoom()">⚔️ JOIN ROOM</button>

 <div id="roomInfo"></div>
 <button id="copyBtn" class="hidden" onclick="copyCode()">📋 COPY ROOM CODE</button>
 <button id="startBtn" class="hidden" onclick="startMatch()">🥊 START FIGHT</button>
</section>

<section id="battle">
 <div class="hud">
  <div class="playerHud">
   <div class="playerName" id="name0">PLAYER 1</div>
   <div class="bar"><div class="hp" id="hp0"></div></div>
   <div id="hpText0">100 HP</div>
   <div class="bar"><div class="charge" id="charge0"></div></div>
   <small id="chargeText0">SUPERPOWER 0%</small>
  </div>
  <div class="playerHud">
   <div class="playerName" id="name1">PLAYER 2</div>
   <div class="bar"><div class="hp" id="hp1"></div></div>
   <div id="hpText1">100 HP</div>
   <div class="bar"><div class="charge" id="charge1"></div></div>
   <small id="chargeText1">SUPERPOWER 0%</small>
  </div>
 </div>

 <div id="arenaWrap">
  <canvas id="game" width="960" height="540"></canvas>
  <button id="fullBtn" onclick="enterFullscreen()">⛶</button>

  <div id="joystick"><div id="stick"></div></div>

  <div id="actionPad">
   <button onclick="doAction('punch')">👊 PUNCH</button>
   <button class="block" onclick="doAction('block')">🛡 BLOCK</button>
   <button class="release" onclick="doAction('release')">RELEASE</button>
   <button class="special" onclick="doAction('special')">⚡ POWER</button>
  </div>
 </div>
</section>
</div>

<script>
/* FULLSCREEN */

async function enterFullscreen(){
 try{
  if(!document.fullscreenElement){
   await document.documentElement.requestFullscreen();
  }
  if(screen.orientation && screen.orientation.lock){
   await screen.orientation.lock("landscape");
  }
 }catch(e){
  console.log("Fullscreen:",e.message);
 }
}

/* SOCKET */

const $=id=>document.getElementById(id);

let connected=false;
let roomCode="";
let mySlot=0;
let gameState=null;
let lastWinner=null;

const socket=io({
 transports:["polling"],
 reconnection:true,
 timeout:20000
});

socket.on("connect",()=>{
 connected=true;
 say("🟢 CONNECTED TO SERVER");
});

socket.on("disconnect",()=>{
 connected=false;
 say("🔴 DISCONNECTED — RECONNECTING...");
});

socket.on("connect_error",err=>{
 connected=false;
 say("CONNECTION ERROR: "+err.message);
});

socket.on("joined",data=>{
 roomCode=data.code || roomCode;
 mySlot=Number(data.slot || 0);
 $("roomInfo").textContent="ROOM CODE: "+roomCode;
 $("copyBtn").classList.remove("hidden");
 $("startBtn").classList.remove("hidden");
 say("ROOM JOINED! WAITING FOR OPPONENT...");
});

socket.on("errorMessage",message=>{
 say("⚠️ "+message);
});

socket.on("state",state=>{
 if(!state)return;

 gameState=state;
 if(state.code)roomCode=state.code;

 if(state.started){
  $("lobby").classList.add("hidden");
  $("battle").style.display="flex";
 }

 updateHUD(state);

 if(state.winner){
  say("🏆 "+state.winner+" WINS!");
  if(lastWinner!==state.winner){
   playSound("defeat");
   lastWinner=state.winner;
  }
 }else{
  lastWinner=null;
  if(state.message)say(state.message);
 }
});

/* ROOM FUNCTIONS */

function say(message){
 $("status").textContent=message;
}

function createRoom(){
 unlockAudio();
 enterFullscreen();
 if(!connected)return say("SERVER CONNECTING — WAIT A MOMENT");

 const name=$("playerName").value.trim();
 if(!name)return say("PLEASE ENTER YOUR NAME");

 socket.emit("createRoom",{
  name,
  character:$("character").value
 });
 say("CREATING ROOM...");
}

function joinRoom(){
 unlockAudio();
 enterFullscreen();
 if(!connected)return say("SERVER CONNECTING — WAIT A MOMENT");

 const name=$("playerName").value.trim();
 const code=$("joinCode").value.trim().toUpperCase();

 if(!name)return say("PLEASE ENTER YOUR NAME");
 if(!code)return say("ENTER ROOM CODE");

 socket.emit("joinRoom",{
  code,
  name,
  character:$("character").value
 });
 say("JOINING ROOM...");
}

function startMatch(){
 unlockAudio();
 enterFullscreen();
 if(!connected)return say("NOT CONNECTED");
 socket.emit("startMatch");
 say("STARTING FIGHT...");
}

function copyCode(){
 if(!roomCode)return;
 if(navigator.clipboard){
  navigator.clipboard.writeText(roomCode)
   .then(()=>say("ROOM CODE COPIED!"))
   .catch(()=>say("ROOM CODE: "+roomCode));
 }else{
  say("ROOM CODE: "+roomCode);
 }
}

/* AUDIO SYSTEM */

const sounds={
 salman:new Audio("/le-re-lund-ke.mp3"),
 shah:new Audio("/shahrukh-khan-call.mp3"),
 amitabh:new Audio("/ma-ka-bhosda-aag.mp3"),
 punch:new Audio("/punch.mp3"),
 defeat:new Audio("/defeat.mp3")
};

Object.values(sounds).forEach(audio=>{
 audio.preload="auto";
 audio.volume=1;
});

let audioUnlocked=false;

function unlockAudio(){
 if(audioUnlocked)return;
 audioUnlocked=true;

 Object.values(sounds).forEach(audio=>{
  try{
   audio.muted=true;
   const promise=audio.play();

   if(promise){
    promise.then(()=>{
     audio.pause();
     audio.currentTime=0;
     audio.muted=false;
    }).catch(()=>{
     audio.muted=false;
    });
   }else{
    audio.muted=false;
   }
  }catch(e){
   audio.muted=false;
  }
 });
}

document.addEventListener("pointerdown",unlockAudio,{once:true});

function playSound(name){
 const original=sounds[name];
 if(!original)return;

 try{
  const audio=original.cloneNode();
  audio.volume=1;
  audio.play().catch(err=>{
   console.log("Audio playback blocked:",err);
  });
 }catch(e){
  console.log("Audio error:",e);
 }
}

/* SERVER CONFIRMED COMBAT SOUNDS */

socket.on("combatEvent",event=>{
 if(!event)return;

 if(event.type==="punch"){
  playSound("punch");
 }

 if(event.type==="special"){
  if(event.character==="Salman Khan")playSound("salman");
  if(event.character==="Shah Rukh Khan")playSound("shah");
  if(event.character==="Amitabh Bachchan")playSound("amitabh");
 }
});

function doAction(action){
 if(!connected)return say("RECONNECTING...");
 unlockAudio();
 socket.emit("action",action);
}

/* HUD */

function updateHUD(state){
 const players=state.players || [];

 players.forEach((p,i)=>{
  if(i>1)return;

  const hp=Math.max(0,Number(p.hp ?? 100));
  const charge=Math.max(0,Math.min(100,Number(p.charge || 0)));

  $("name"+i).textContent=p.name || p.character || "PLAYER "+(i+1);
  $("hp"+i).style.width=hp+"%";
  $("hpText"+i).textContent=hp+" HP";
  $("charge"+i).style.width=charge+"%";
  $("chargeText"+i).textContent="SUPERPOWER "+charge+"%";
 });
}

/* GRAPHICS */

const canvas=$("game");
const ctx=canvas.getContext("2d");

const arenaImage=new Image();
arenaImage.src="/arena.png";

const fighterImage=new Image();
fighterImage.src="/characters/fighters.png";

/* Smoothly follow server positions */
const visualPositions={};

function getVisualPosition(p,index){
 const id=p.id || String(index);
 const targetX=Number(p.x ?? (index===0?25:75));
 const targetY=Number(p.y ?? 50);

 if(!visualPositions[id]){
  visualPositions[id]={x:targetX,y:targetY};
 }

 const pos=visualPositions[id];
 pos.x+=(targetX-pos.x)*0.22;
 pos.y+=(targetY-pos.y)*0.22;

 return pos;
}

function drawFighter(p,index){
 const pos=getVisualPosition(p,index);

 const x=48+(pos.x/100)*864;
 const y=115+(pos.y/100)*290;

 const facing=p.facing || (index===0?1:-1);

 const character=p.character || "";
 const spriteIndex=character.includes("Shah")?1:
                   character.includes("Amitabh")?2:0;

 ctx.save();

 /* Fighter shadow */
 ctx.fillStyle="#0009";
 ctx.beginPath();
 ctx.ellipse(x,y-4,55,13,0,0,Math.PI*2);
 ctx.fill();

 ctx.translate(x,y);
 ctx.scale(facing,1);

 if(fighterImage.complete && fighterImage.naturalWidth>0){
  const sw=fighterImage.naturalWidth/3;
  const sh=fighterImage.naturalHeight;

  ctx.drawImage(
   fighterImage,
   spriteIndex*sw,0,sw,sh,
   -65,-165,130,165
  );
 }else{
  ctx.fillStyle=index===0?"#d92d3a":"#277bd6";
  ctx.fillRect(-35,-115,70,115);
  ctx.beginPath();
  ctx.arc(0,-135,28,0,Math.PI*2);
  ctx.fill();
 }

 if(p.blocking){
  ctx.strokeStyle="#39c9ff";
  ctx.lineWidth=8;
  ctx.beginPath();
  ctx.arc(0,-80,75,-1.4,1.4);
  ctx.stroke();
 }

 if(p.attacking){
  ctx.strokeStyle="#ffdc62";
  ctx.lineWidth=13;
  ctx.lineCap="round";
  ctx.beginPath();
  ctx.moveTo(25,-90);
  ctx.lineTo(105,-105);
  ctx.stroke();

  ctx.fillStyle="#fff0a0";
  ctx.beginPath();
  ctx.arc(110,-105,12,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();
}

function draw(){
 ctx.clearRect(0,0,960,540);

 if(arenaImage.complete && arenaImage.naturalWidth>0){
  ctx.drawImage(arenaImage,0,0,960,540);
 }else{
  const gradient=ctx.createLinearGradient(0,0,0,540);
  gradient.addColorStop(0,"#18243c");
  gradient.addColorStop(1,"#090d18");
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,960,540);
  ctx.fillStyle="#d6a13b";
  ctx.fillRect(0,420,960,5);
  ctx.fillStyle="#222d42";
  ctx.fillRect(0,425,960,115);
 }

 if(gameState && gameState.players){
  gameState.players.forEach((p,i)=>drawFighter(p,i));
 }else{
  drawFighter({id:"demo1",character:"Salman Khan",x:25,y:50},0);
  drawFighter({id:"demo2",character:"Shah Rukh Khan",x:75,y:50},1);
 }

 requestAnimationFrame(draw);
}

/* TOUCH JOYSTICK */

const joy=$("joystick");
const stick=$("stick");

let joyActive=false;
let joyDX=0;
let joyDY=0;

function updateJoystick(e){
 const r=joy.getBoundingClientRect();
 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;

 const max=r.width*0.34;
 const distance=Math.hypot(dx,dy);

 if(distance>max){
  dx=dx/distance*max;
  dy=dy/distance*max;
 }

 stick.style.transform=`translate(${dx}px,${dy}px)`;

 joyDX=Math.abs(dx)<10?0:dx/max;
 joyDY=Math.abs(dy)<10?0:dy/max;
}

joy.addEventListener("pointerdown",e=>{
 unlockAudio();
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 updateJoystick(e);
});

joy.addEventListener("pointermove",e=>{
 if(joyActive)updateJoystick(e);
});

function stopJoystick(){
 joyActive=false;
 joyDX=0;
 joyDY=0;
 stick.style.transform="translate(0,0)";
}

joy.addEventListener("pointerup",stopJoystick);
joy.addEventListener("pointercancel",stopJoystick);

/* Faster movement updates */
setInterval(()=>{
 if(connected && joyActive && (joyDX!==0 || joyDY!==0)){
  socket.emit("move",{dx:joyDX,dy:joyDY});
 }
},70);

/* KEYBOARD */

const keys={};

window.addEventListener("keydown",e=>{
 const key=e.key.toLowerCase();
 if(keys[key])return;
 keys[key]=true;

 if(key==="j")doAction("punch");
 if(key==="k")doAction("block");
 if(key==="l")doAction("release");
 if(key==="i")doAction("special");
});

window.addEventListener("keyup",e=>{
 const key=e.key.toLowerCase();
 keys[key]=false;

 if(key==="k")doAction("release");
});

setInterval(()=>{
 if(!connected)return;

 let dx=0,dy=0;
 if(keys.a || keys.arrowleft)dx=-1;
 if(keys.d || keys.arrowright)dx=1;
 if(keys.w || keys.arrowup)dy=-1;
 if(keys.s || keys.arrowdown)dy=1;

 if(dx!==0 || dy!==0){
  socket.emit("move",{dx,dy});
 }
},70);

draw();
</script>
</body>
</html>
