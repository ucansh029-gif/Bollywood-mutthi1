
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SUPERSTAR SHOWDOWN</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b16;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
button,input,select{font:inherit}
button{
 border:0;border-radius:12px;padding:13px 17px;
 color:white;background:linear-gradient(135deg,#e52b36,#8d101c);
 font-weight:bold;cursor:pointer;
}
button:active{transform:scale(.96)}
input,select{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #50566b;background:#151b2c;
 color:white;margin:6px 0 12px;
}
#app{min-height:100dvh;display:flex;flex-direction:column}
header{
 text-align:center;padding:10px;
 background:linear-gradient(90deg,#11182a,#3b1019,#11182a);
 border-bottom:2px solid #d7a33c;
}
header h1{margin:0;color:#ffd36b;font-size:clamp(21px,4vw,36px)}
header small{letter-spacing:3px;color:#ddd}
#status{
 text-align:center;padding:7px;color:#ffd36b;
 font-size:13px;font-weight:bold;
}
#lobby{
 width:min(94%,520px);margin:12px auto;
 padding:18px;background:#141b2b;border:1px solid #454d65;
 border-radius:18px;box-shadow:0 10px 40px #0008;
}
#lobby h2{text-align:center;color:#ffd36b;margin:0 0 15px}
label{font-size:13px;color:#cbd1df}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
#roomInfo{text-align:center;margin-top:12px;color:#ffd36b}
#battle{display:none;flex:1;min-height:0;flex-direction:column}
.hud{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;
 padding:8px 12px;background:#111827;
}
.playerHud{min-width:0}
.playerHud:last-child{text-align:right}
.playerName{font-weight:bold;color:#ffd36b;font-size:14px}
.bar{height:12px;background:#343b4c;border-radius:20px;overflow:hidden;margin:5px 0}
.hp{height:100%;width:100%;background:linear-gradient(90deg,#19c65a,#a7ff5c);transition:width .2s}
.charge{height:7px;width:0;background:#35caff;transition:width .2s}
#arenaWrap{
 flex:1;min-height:0;position:relative;background:#080b16;
 display:flex;align-items:center;justify-content:center;
}
canvas{width:100%;height:100%;object-fit:contain;display:block}
#controls{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:6px;padding:8px;background:#111827;
}
#controls button{padding:12px 3px;font-size:12px}
#controls .special{background:linear-gradient(135deg,#b56bff,#5521a8)}
#controls .block{background:linear-gradient(135deg,#2476c8,#12376c)}
#controls .move{background:linear-gradient(135deg,#3a465e,#202a3d)}
#copyBtn{background:#263650}
@media (orientation:portrait){
 #battle{min-height:0}
 #arenaWrap{min-height:220px}
 #controls button{font-size:10px;padding:11px 2px}
}
.hidden{display:none!important}
</style>
</head>

<body>
<div id="app">
<header>
 <h1>🥊 SUPERSTAR SHOWDOWN 🥊</h1>
 <small>THE BOLLYWOOD BOXING CHAMPIONSHIP</small>
</header>

<div id="status">CONNECTING TO SERVER...</div>

<section id="lobby">
 <h2>ENTER THE ARENA</h2>

 <label>YOUR NAME</label>
 <input id="playerName" maxlength="16" placeholder="Enter your name">

 <label>CHOOSE YOUR SUPERSTAR</label>
 <select id="character">
  <option value="Salman Khan">Salman Khan — Bhaijaan Power</option>
  <option value="Shah Rukh Khan">Shah Rukh Khan — King Khan Power</option>
  <option value="Amitabh Bachchan">Amitabh Bachchan — Big B Power</option>
 </select>

 <button style="width:100%" onclick="createRoom()">🔥 CREATE ROOM</button>

 <div style="text-align:center;margin:15px;color:#8993a9">— OR JOIN A FRIEND —</div>

 <label>ROOM CODE</label>
 <input id="joinCode" maxlength="8" placeholder="Enter room code">
 <button style="width:100%" onclick="joinRoom()">⚔️ JOIN ROOM</button>

 <div id="roomInfo"></div>
 <button id="copyBtn" class="hidden" style="width:100%;margin-top:10px" onclick="copyCode()">COPY ROOM CODE</button>
 <button id="startBtn" class="hidden" style="width:100%;margin-top:10px" onclick="startMatch()">START FIGHT 🥊</button>
</section>

<section id="battle">
 <div class="hud">
  <div class="playerHud">
   <div class="playerName" id="name0">PLAYER 1</div>
   <div class="bar"><div class="hp" id="hp0"></div></div>
   <div id="hpText0">100 HP</div>
   <div class="bar"><div class="charge" id="charge0"></div></div>
   <small id="chargeText0">SUPERPOWER 0%</small>
  </div>
  <div class="playerHud">
   <div class="playerName" id="name1">PLAYER 2</div>
   <div class="bar"><div class="hp" id="hp1"></div></div>
   <div id="hpText1">100 HP</div>
   <div class="bar"><div class="charge" id="charge1"></div></div>
   <small id="chargeText1">SUPERPOWER 0%</small>
  </div>
 </div>

 <div id="arenaWrap">
  <canvas id="game" width="960" height="540"></canvas>
 </div>

 <div id="controls">
  <button class="move" onclick="move(-1,0)">◀ LEFT</button>
  <button onclick="doAction('punch')">👊 PUNCH</button>
  <button class="block" onclick="doAction('block')">🛡 BLOCK</button>
  <button onclick="doAction('release')">RELEASE</button>
  <button class="special" onclick="doAction('special')">⚡ POWER</button>
 </div>
</section>
</div>

<script>
 async function lockLandscape(){
 try{
  if(screen.orientation && screen.orientation.lock){
   await screen.orientation.lock("landscape");
  }
 }catch(e){
  console.log("Landscape lock not supported:",e);
 }
}

document.addEventListener("click",()=>{
 if(document.fullscreenElement) return;
 document.documentElement.requestFullscreen()
  .then(lockLandscape)
  .catch(()=>{});
},{once:true});
const $ = id => document.getElementById(id);

let socket;
let connected = false;
let roomCode = "";
let mySlot = 0;
let gameState = null;
let lastMessage = "";
let fighters = [];
let arenaImage = new Image();
let fighterImage = new Image();

arenaImage.src = "/arena.png";
fighterImage.src = "/characters/fighters.png";

const sounds = {
 salman: new Audio("/le-re-lund-ke.mp3"),
 shah: new Audio("/shahrukh-khan-call.mp3"),
 amitabh: new Audio("/ma-ka-bhosda-aag.mp3"),
 punch: new Audio("/punch.mp3"),
 defeat: new Audio("/defeat.mp3")
};

function playSound(name){
 const a = sounds[name];
 if(!a) return;
 try{
  a.currentTime = 0;
  a.play().catch(()=>{});
 }catch(e){}
}

function say(message){
 $("status").textContent = message;
}

function connectSocket(){
 if(typeof io !== "function"){
  say("SOCKET.IO SCRIPT NOT LOADED — RELOAD PAGE");
  return;
 }

 socket = io(window.location.origin,{
  transports:["polling","websocket"],
  reconnection:true,
  reconnectionAttempts:Infinity,
  timeout:20000
 });

 socket.on("connect",()=>{
  connected = true;
  say("🟢 CONNECTED TO SERVER");
 });

 socket.on("disconnect",()=>{
  connected = false;
  say("🔴 DISCONNECTED — RECONNECTING...");
 });

 socket.on("connect_error",(err)=>{
  connected = false;
  say("CONNECTION ERROR: "+err.message);
 });

 socket.on("joined",(data)=>{
  roomCode = data.code || roomCode;
  mySlot = Number(data.slot || 0);
  $("roomInfo").textContent = "ROOM CODE: "+roomCode;
  $("copyBtn").classList.remove("hidden");
  $("startBtn").classList.remove("hidden");
  say("ROOM JOINED! WAITING FOR OPPONENT...");
 });

 socket.on("notice",(message)=>{
  if(message) say(String(message));
 });

 socket.on("errorMessage",(message)=>{
  say("⚠️ "+message);
 });

 socket.on("state",(state)=>{
  if(!state) return;
  gameState = state;

  if(state.code) roomCode = state.code;

  if(state.started){
   $("lobby").classList.add("hidden");
   $("battle").style.display = "flex";
  }

  if(state.winner){
   say("🏆 "+state.winner+" WINS!");
   playSound("defeat");
  }else if(state.message){
   say(state.message);
  }

  updateHUD(state);
 });
}

function createRoom(){
 if(!connected) return say("SERVER CONNECTING — PLEASE WAIT");
 const name = $("playerName").value.trim();
 if(!name) return say("PLEASE ENTER YOUR NAME");

 socket.emit("createRoom",{
  name:name,
  character:$("character").value
 });
 say("CREATING ROOM...");
}

function joinRoom(){
 if(!connected) return say("SERVER CONNECTING — PLEASE WAIT");
 const name = $("playerName").value.trim();
 const code = $("joinCode").value.trim().toUpperCase();

 if(!name) return say("PLEASE ENTER YOUR NAME");
 if(!code) return say("PLEASE ENTER ROOM CODE");

 socket.emit("joinRoom",{
  code:code,
  name:name,
  character:$("character").value
 });
 say("JOINING ROOM...");
}

function startMatch(){
 if(!connected) return say("NOT CONNECTED");
 socket.emit("startMatch");
 say("STARTING FIGHT...");
}

function copyCode(){
 if(!roomCode) return;
 if(navigator.clipboard && navigator.clipboard.writeText){
  navigator.clipboard.writeText(roomCode)
   .then(()=>say("ROOM CODE COPIED!"))
   .catch(()=>say("ROOM CODE: "+roomCode));
 }else{
  say("ROOM CODE: "+roomCode);
 }
}

function doAction(action){
 if(!connected) return say("RECONNECTING...");
 socket.emit("action",action);
 if(action === "punch") playSound("punch");
 if(action === "special"){
  const p = gameState && gameState.players && gameState.players[mySlot];
  if(p){
   if(p.character === "Salman Khan") playSound("salman");
   if(p.character === "Shah Rukh Khan") playSound("shah");
   if(p.character === "Amitabh Bachchan") playSound("amitabh");
  }
 }
}

function move(dx,dy){
 if(connected) socket.emit("move",{dx:dx,dy:dy});
}

function updateHUD(state){
 const players = state.players || [];

 players.forEach((p,i)=>{
  if(i>1) return;
  const hp = Math.max(0,Number(p.hp ?? 100));
  const charge = Math.max(0,Math.min(100,Number(p.charge || 0)));

  $("name"+i).textContent = p.name || p.character || "PLAYER "+(i+1);
  $("hp"+i).style.width = hp+"%";
  $("hpText"+i).textContent = hp+" HP";
  $("charge"+i).style.width = charge+"%";
  $("chargeText"+i).textContent = "SUPERPOWER "+charge+"%";
 });
}

const canvas = $("game");
const ctx = canvas.getContext("2d");

function drawFighter(p,index){
 const x = 48 + (Number(p.x ?? (index===0?25:75))/100)*804;
 const y = 118 + (Number(p.y ?? 50)/100)*280;
 const facing = p.facing || (index===0?1:-1);

 const character = p.character || "";
 const spriteIndex = character.includes("Shah") ? 1 :
                     character.includes("Amitabh") ? 2 : 0;

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(facing,1);

 if(fighterImage.complete && fighterImage.naturalWidth>0){
  const sw=fighterImage.naturalWidth/3;
  const sh=fighterImage.naturalHeight;

  ctx.drawImage(
   fighterImage,
   spriteIndex*sw,0,sw,sh,
   -65,-165,130,165
  );
 }else{
  ctx.fillStyle=index===0?"#d92d3a":"#277bd6";
  ctx.fillRect(-35,-115,70,115);
  ctx.beginPath();
  ctx.arc(0,-135,28,0,Math.PI*2);
  ctx.fill();
 }

 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 if(arenaImage.complete && arenaImage.naturalWidth>0){
  ctx.drawImage(arenaImage,0,0,960,540);
 }else{
  const g=ctx.createLinearGradient(0,0,0,540);
  g.addColorStop(0,"#18243c");
  g.addColorStop(1,"#090d18");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,960,540);
  ctx.fillStyle="#d6a13b";
  ctx.fillRect(0,420,960,5);
  ctx.fillStyle="#222d42";
  ctx.fillRect(0,425,960,115);
 }

 ctx.fillStyle="#ffffff22";
 ctx.fillRect(0,420,960,120);

 if(gameState && gameState.players){
  gameState.players.forEach((p,i)=>drawFighter(p,i));
 }else{
  drawFighter({character:"Salman Khan",x:300,y:420},0);
  drawFighter({character:"Shah Rukh Khan",x:660,y:420},1);
 }

 requestAnimationFrame(draw);
}

window.addEventListener("keydown",(e)=>{
 const k=e.key.toLowerCase();
 if(k==="a") move(-1,0);
 if(k==="d") move(1,0);
 if(k==="w") move(0,-1);
 if(k==="s") move(0,1);
 if(k==="j") doAction("punch");
 if(k==="k") doAction("block");
 if(k==="l") doAction("release");
 if(k==="i") doAction("special");
});

connectSocket();
draw();
</script>
</body>
</html>
