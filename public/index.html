<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERSTAR SHOWDOWN</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:white;font-family:Arial;text-align:center}
header{padding:14px;background:linear-gradient(90deg,#741322,#17152d,#123b68)}
h1{font-size:clamp(23px,5vw,36px);margin:4px}
.subtitle{color:#ffd76a;letter-spacing:2px;font-size:12px}
main{max-width:1100px;margin:auto;padding:8px}
.panel{background:#151b2c;border:1px solid #39435b;border-radius:12px;padding:12px;margin:9px 0}
input,select,button{padding:12px;border:0;border-radius:8px;font-size:15px}
input,select{background:#252e43;color:white;max-width:100%}
button{background:#bd263b;color:white;font-weight:bold}
.blue{background:#2464b5}
.gold{background:#c58a19;color:#160d00}
.green{background:#168b59}
#status{color:#ffd76a;min-height:22px}
#roomCode{font-size:25px;color:#ffdf75;letter-spacing:5px;margin:10px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.playerBox{background:#202a40;padding:9px;border-radius:9px}
.bar{height:13px;background:#3a4050;border-radius:20px;overflow:hidden;margin:6px 0}
.hp{height:100%;width:100%;background:#e63848}
.power{height:100%;width:0;background:#ffce37}
#game{display:block;width:100%;height:auto;background:#101526;border:2px solid #d7a83e;border-radius:10px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}
#joystick{width:110px;height:110px;border-radius:50%;background:#25314a;border:3px solid #7788a9;position:relative;touch-action:none;flex-shrink:0}
#stick{width:48px;height:48px;border-radius:50%;background:#d8ddeb;position:absolute;left:28px;top:28px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1}
.actions button{min-height:52px}
.small{font-size:12px;color:#aab5cc}
@media(max-width:400px){
#joystick{width:95px;height:95px}
#stick{left:22px;top:22px}
.actions button{font-size:12px;padding:8px}
}
</style>
</head>
<body>

<header>
<h1>🥊 SUPERSTAR SHOWDOWN 🥊</h1>
<div class="subtitle">THE BOLLYWOOD BOXING CHAMPIONSHIP</div>
</header>

<main>
<section class="panel">
<input id="playerName" placeholder="Enter your name" maxlength="16">
<br><br>
<select id="character">
<option>Salman Khan</option>
<option>Shah Rukh Khan</option>
<option>Amitabh Bachchan</option>
</select>
<button onclick="createRoom()">CREATE ROOM</button>
<hr>
<input id="joinCode" placeholder="Enter room code" maxlength="6">
<button class="blue" onclick="joinRoom()">JOIN ROOM</button>
<div class="small">Share your room code with your friend.</div>
<div id="roomCode">------</div>
<button class="gold" onclick="copyCode()">COPY CODE</button>
<p id="status">Connecting to server...</p>
<button class="green" onclick="startMatch()">🥊 START FIGHT</button>
</section>

<section class="panel">
<div class="bars">
<div class="playerBox">
<b id="name1">PLAYER 1</b>
<div class="bar"><div class="hp" id="hp1"></div></div>
<div class="small">HEALTH</div>
<div class="bar"><div class="power" id="power1"></div></div>
<div class="small">SUPERPOWER</div>
</div>
<div class="playerBox">
<b id="name2">PLAYER 2</b>
<div class="bar"><div class="hp" id="hp2"></div></div>
<div class="small">HEALTH</div>
<div class="bar"><div class="power" id="power2"></div></div>
<div class="small">SUPERPOWER</div>
</div>
</div>
</section>

<section class="panel">
<canvas id="game" width="900" height="500"></canvas>
<div class="controls">
<div id="joystick"><div id="stick"></div></div>
<div class="actions">
<button onclick="doAction('punch')">👊 PUNCH</button>
<button class="blue" id="blockBtn">🛡️ BLOCK</button>
<button class="gold" onclick="doAction('special')">⚡ SUPERPOWER</button>
<button class="green" onclick="startMatch()">🥊 FIGHT</button>
</div>
</div>
<p class="small">Use joystick to move. Get close to your opponent to punch.</p>
</section>
<p class="small">Unofficial fan-made game.</p>
</main>

<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);
const statusBox = $("status");

let socket = null;
let mySlot = null;
let currentCode = "";
let gameState = null;
let joyX = 0, joyY = 0;
let joystickActive = false;
let attackingUntil = 0;
let effectText = "";
let effectUntil = 0;

function say(message) {
  statusBox.textContent = message;
}

if (typeof io === "undefined") {
  say("Socket.IO script failed to load. Refresh the page.");
} else {
  socket = io({
    transports: ["polling"],
    reconnection: true,
    reconnectionAttempts: Infinity,
    timeout: 20000
  });

  socket.on("connect", () => {
    say("SERVER CONNECTED! Create or join a room.");
  });

  socket.on("connect_error", err => {
    say("CONNECTION FAILED: " + err.message);
  });

  socket.on("disconnect", reason => {
    say("Disconnected: " + reason);
  });

  socket.on("joined", data => {
    currentCode = data.code;
    mySlot = data.slot;
    $("roomCode").textContent = data.code;
    say("Room joined! You are Player " + (mySlot + 1));
  });

  socket.on("state", state => {
    gameState = state;
    if (state.code) {
      currentCode = state.code;
      $("roomCode").textContent = state.code;
    }
    updateBars();
    if (state.message) say(state.message);
  });

  socket.on("errorMessage", message => say(message));
}

function createRoom() {
  const name = $("playerName").value.trim();
  if (!name) return say("Enter your name first!");
  if (!socket || !socket.connected) return say("Server not connected!");
  socket.emit("createRoom", {
    name,
    character: $("character").value
  });
  say("Creating room...");
}

function joinRoom() {
  const name = $("playerName").value.trim();
  const code = $("joinCode").value.trim().toUpperCase();
  if (!name) return say("Enter your name first!");
  if (code.length !== 6) return say("Enter a valid room code!");
  if (!socket || !socket.connected) return say("Server not connected!");
  socket.emit("joinRoom", {
    code,
    name,
    character: $("character").value
  });
  say("Joining room...");
}

function startMatch() {
  if (!socket || !socket.connected) return say("Server not connected!");
  socket.emit("startMatch");
}

function copyCode() {
  if (!currentCode) return say("Create or join a room first!");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(currentCode)
      .then(() => say("Room code copied!"))
      .catch(() => say("Room code: " + currentCode));
  } else {
    say("Room code: " + currentCode);
  }
}

function doAction(type) {
  if (!socket || !socket.connected) return say("Server disconnected!");
  if (!gameState || !gameState.started) return say("Start the fight first!");
  socket.emit("action", type);
  attackingUntil = Date.now() + 250;
  effectText = type === "special" ? "⚡ SUPER POWER!" : "POW!";
  effectUntil = Date.now() + 700;
}

function updateBars() {
  if (!gameState || !gameState.players) return;
  gameState.players.forEach((p, i) => {
    const n = i + 1;
    $("name" + n).textContent = p.name || "PLAYER " + n;
    $("hp" + n).style.width = Math.max(0, p.hp) + "%";
    $("power" + n).style.width = Math.max(0, p.charge) + "%";
  });
}

const joystick = $("joystick");
const stick = $("stick");

function moveJoystick(e) {
  const rect = joystick.getBoundingClientRect();
  let dx = (e.clientX - rect.left - rect.width / 2) / (rect.width / 2);
  let dy = (e.clientY - rect.top - rect.height / 2) / (rect.height / 2);
  const length = Math.hypot(dx, dy);
  if (length > 1) {
    dx /= length;
    dy /= length;
  }
  joyX = dx;
  joyY = dy;
  const max = rect.width / 2 - 25;
  stick.style.left = (rect.width / 2 - 24 + dx * max) + "px";
  stick.style.top = (rect.height / 2 - 24 + dy * max) + "px";
}

joystick.addEventListener("pointerdown", e => {
  joystickActive = true;
  joystick.setPointerCapture(e.pointerId);
  moveJoystick(e);
});
joystick.addEventListener("pointermove", e => {
  if (joystickActive) moveJoystick(e);
});
function stopJoystick() {
  joystickActive = false;
  joyX = 0;
  joyY = 0;
  stick.style.left = (joystick.clientWidth / 2 - 24) + "px";
  stick.style.top = (joystick.clientHeight / 2 - 24) + "px";
}
joystick.addEventListener("pointerup", stopJoystick);
joystick.addEventListener("pointercancel", stopJoystick);

setInterval(() => {
  if (socket && socket.connected && mySlot !== null &&
      (Math.abs(joyX) > 0.08 || Math.abs(joyY) > 0.08)) {
    socket.emit("move", {dx: joyX, dy: joyY});
  }
}, 80);

const blockBtn = $("blockBtn");
function blockStart(e) {
  e.preventDefault();
  if (socket && socket.connected) socket.emit("action", "block");
}
function blockEnd(e) {
  e.preventDefault();
  if (socket && socket.connected) socket.emit("action", "release");
}
blockBtn.addEventListener("pointerdown", blockStart);
blockBtn.addEventListener("pointerup", blockEnd);
blockBtn.addEventListener("pointercancel", blockEnd);
blockBtn.addEventListener("pointerleave", e => {
  if (e.buttons === 0) blockEnd(e);
});

const canvas = $("game");
const ctx = canvas.getContext("2d");
const arenaImage = new Image();
arenaImage.src = "/arena.png";
const fighterImage = new Image();
fighterImage.src = "/characters/fighters.png";

function drawRing() {
  if (arenaImage.complete && arenaImage.naturalWidth > 0) {
    ctx.drawImage(arenaImage, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = "#101526";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#d0a044";
    ctx.fillRect(35, 105, 830, 330);
    ctx.fillStyle = "#e8d4ad";
    ctx.fillRect(48, 118, 804, 305);
    ctx.strokeStyle = "#b72c42";
    ctx.lineWidth = 8;
    ctx.strokeRect(48, 118, 804, 305);
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = "#d83b4a";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(48, 180 + i * 55);
      ctx.lineTo(852, 180 + i * 55);
      ctx.stroke();
    }
  }
}

function drawFighter(p, slot) {
  const x = 48 + (p.x / 100) * 804;
  const y = 118 + (p.y / 100) * 280;
  const character = (p.character || "").toLowerCase();
  let index = 0;
  if (character.includes("shah") || character.includes("srk")) index = 1;
  else if (character.includes("amitabh") || character.includes("big")) index = 2;

  const now = Date.now();
  const attacking = p.attacking || (now < attackingUntil && mySlot === slot);
  const blocking = p.blocking;
  const facing = slot === 0 ? 1 : -1;
  const bob = Math.sin(now / 160 + slot) * 4;

  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(facing, 1);

  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.beginPath();
  ctx.ellipse(0, 5, 45, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  if (fighterImage.complete && fighterImage.naturalWidth > 0) {
    const sw = fighterImage.naturalWidth / 3;
    ctx.drawImage(fighterImage, index * sw, 0, sw,
      fighterImage.naturalHeight, -65, -165, 130, 165);
  } else {
    ctx.fillStyle = "#d99a6c";
    ctx.beginPath();
    ctx.arc(0, -110, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = ["#a92d3e", "#2767a9", "#793ca0"][index];
    ctx.fillRect(-28, -85, 56, 75);
  }

  if (attacking) {
    ctx.strokeStyle = "#ffdc3c";
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(25, -85);
    ctx.lineTo(85, -85);
    ctx.stroke();
  }
  if (blocking) {
    ctx.strokeStyle = "#55d8ff";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(0, -85, 48, -1.3, 1.3);
    ctx.stroke();
  }
  ctx.restore();

  ctx.fillStyle = "white";
  ctx.font = "bold 16px Arial";
  ctx.textAlign = "center";
  ctx.fillText(p.name || "FIGHTER", x, y + 25);
}

function render() {
  drawRing();
  if (gameState && gameState.players) {
    gameState.players.forEach((p, i) => drawFighter(p, i));
  } else {
    ctx.fillStyle = "white";
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    ctx.fillText("CREATE A ROOM TO ENTER THE RING", 450, 260);
  }
  if (Date.now() < effectUntil) {
    ctx.fillStyle = "#ffdf58";
    ctx.font = "bold 35px Arial";
    ctx.textAlign = "center";
    ctx.fillText(effectText, 450, 100);
  }
  if (gameState && gameState.winner) {
    ctx.fillStyle = "#ffdf58";
    ctx.font = "bold 42px Arial";
    ctx.textAlign = "center";
    ctx.fillText("WINNER!", 450, 245);
  }
  requestAnimationFrame(render);
}

window.createRoom = createRoom;
window.joinRoom = joinRoom;
window.startMatch = startMatch;
window.copyCode = copyCode;
window.doAction = doAction;
render();
</script>
</body>
</html>
