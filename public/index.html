
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SUPERSTAR SHOWDOWN</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050711;color:white;font-family:Arial,sans-serif;touch-action:pan-x pan-y}
button,input,select{font:inherit}
button{border:0;color:white;font-weight:900;cursor:pointer;touch-action:none}
#app{height:100dvh;width:100%;display:flex;flex-direction:column;background:#070a14}
header{height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(90deg,#390d1b,#111729,#092747);border-bottom:1px solid #b68b39}
.logo{font-weight:1000;letter-spacing:1px;color:#ffd66b;font-size:clamp(13px,2.5vw,21px)}
#status{font-size:10px;color:#b9d5c9}
#menuBtn{background:#293650;padding:7px 12px;border-radius:7px}
#hud{height:55px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:5px 12px;background:#0c1220}
.fighterHud{width:43%;max-width:400px}
.fighterName{font-size:clamp(11px,2vw,17px);font-weight:900;margin-bottom:4px}
.healthTrack,.powerTrack{height:12px;background:#30384a;border-radius:20px;overflow:hidden}
.healthFill{height:100%;width:100%;background:linear-gradient(90deg,#a90d2d,#ff4057);transition:width .2s}
.powerFill{height:100%;width:0;background:linear-gradient(90deg,#e18a11,#ffe35b);transition:width .2s}
.powerTrack{height:6px;margin-top:4px}
#roundInfo{font-size:11px;color:#ffdc75;text-align:center;font-weight:bold}
#arenaWrap{position:relative;flex:1;min-height:0;background:#080d18;overflow:hidden}
#game{display:block;width:100%;height:100%;object-fit:fill}
#message{position:absolute;top:10%;left:50%;transform:translateX(-50%);color:#ffdf76;font-weight:1000;font-size:clamp(16px,4vw,34px);text-shadow:0 3px 10px #000;pointer-events:none;text-align:center;white-space:nowrap;z-index:3}
#hint{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);color:#fff;font-size:9px;text-shadow:0 2px 5px #000;white-space:nowrap;pointer-events:none}
#joystick{position:absolute;bottom:13px;left:15px;width:clamp(76px,13vw,105px);height:clamp(76px,13vw,105px);border-radius:50%;background:#25334edc;border:4px solid #9aabc9;touch-action:none;box-shadow:inset 0 0 18px #0008;z-index:5}
#stick{position:absolute;width:42%;height:42%;left:29%;top:29%;border-radius:50%;background:#e3e8f5;box-shadow:0 3px 10px #0009;pointer-events:none}
.actionGrid{position:absolute;bottom:12px;right:14px;display:grid;grid-template-columns:1fr 1fr;gap:7px;width:min(45%,330px);z-index:5}
.actionGrid button{min-height:clamp(40px,8vh,61px);border-radius:11px;font-size:clamp(10px,1.8vw,15px);box-shadow:inset 0 -4px #0003,0 3px 9px #0006}
#punchBtn{background:linear-gradient(#f04a54,#a80e32)}
#blockBtn{background:linear-gradient(#368ce0,#174a91)}
#specialBtn{background:linear-gradient(#f5bd37,#ad6a0a);color:#211300}
#fightBtn{background:linear-gradient(#1db77c,#087348)}
#lobby{position:fixed;z-index:100;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94%,650px);max-height:calc(100dvh - 50px);overflow-y:auto;padding:13px;background:#111a2c;border:2px solid #c69b48;border-radius:15px;box-shadow:0 15px 60px #000b;text-align:center}
#lobby h2{margin:0 0 10px;color:#ffd66b}
#lobby input,#lobby select{width:100%;padding:11px;margin:5px 0;background:#26334a;color:white;border:1px solid #45536d;border-radius:8px}
#lobby button{width:100%;padding:12px;margin:4px 0;border-radius:8px}
#createBtn{background:#bd293f}
#joinBtn{background:#2469bb}
#startBtn{background:#128b5c}
#copyBtn{background:#bd861c;color:#17100a}
#closeLobby{background:#34425c}
#roomCode{color:#ffda70;font-size:22px;letter-spacing:5px;margin:7px}
@media(orientation:landscape){
 header{height:32px}
 #hud{height:48px;padding:3px 15px}
 #lobby{width:min(70%,600px);max-height:calc(100dvh - 38px);padding:8px 12px}
 #lobby h2{font-size:20px;margin:2px}
 #lobby input,#lobby select{padding:7px;margin:2px 0}
 #lobby button{padding:8px;margin:2px 0}
 #roomCode{margin:3px}
 #joystick{width:78px;height:78px;bottom:9px}
 .actionGrid{bottom:9px;width:min(40%,310px)}
 .actionGrid button{min-height:37px}
}
</style>
</head>
<body>
<div id="app">

<header>
 <div class="logo">🥊 SUPERSTAR SHOWDOWN</div>
 <div id="status">CONNECTING...</div>
 <button id="menuBtn">MENU</button>
</header>

<section id="hud">
 <div class="fighterHud">
  <div class="fighterName" id="name1">PLAYER 1</div>
  <div class="healthTrack"><div class="healthFill" id="hp1"></div></div>
  <div class="powerTrack"><div class="powerFill" id="power1"></div></div>
 </div>
 <div id="roundInfo">ROUND 1</div>
 <div class="fighterHud" style="text-align:right">
  <div class="fighterName" id="name2">PLAYER 2</div>
  <div class="healthTrack"><div class="healthFill" id="hp2"></div></div>
  <div class="powerTrack"><div class="powerFill" id="power2"></div></div>
 </div>
</section>

<div id="arenaWrap">
 <canvas id="game" width="1280" height="720"></canvas>
 <div id="message">CREATE A ROOM TO PLAY</div>

 <div id="joystick"><div id="stick"></div></div>

 <div class="actionGrid">
  <button id="punchBtn">👊 PUNCH</button>
  <button id="blockBtn">🛡️ BLOCK</button>
  <button id="specialBtn">⚡ SUPERPOWER</button>
  <button id="fightBtn">🥊 FIGHT</button>
 </div>
 <div id="hint">MOVE • PUNCH • BLOCK • UNLEASH YOUR POWER</div>
</div>

<section id="lobby">
 <h2>CHOOSE YOUR FIGHTER</h2>
 <input id="playerName" placeholder="Enter your name" maxlength="16">
 <select id="character">
  <option>Salman Khan</option>
  <option>Shah Rukh Khan</option>
  <option>Amitabh Bachchan</option>
 </select>
 <button id="createBtn">CREATE ROOM</button>
 <input id="joinCode" placeholder="ENTER FRIEND'S ROOM CODE" maxlength="6">
 <button id="joinBtn">CONFIRM & JOIN ROOM</button>
 <div id="roomCode">------</div>
 <button id="copyBtn">COPY ROOM CODE</button>
 <button id="startBtn">🥊 START FIGHT</button>
 <button id="closeLobby">CLOSE MENU</button>
</section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");

let socket=null,mySlot=null,currentCode="",gameState=null;
let joyX=0,joyY=0,joyActive=false;
let effects=[],shake=0,lastTime=0,animTime=0;
let speech=[],previousHP=[];
let matchEnded=false;

const arena=new Image();
arena.src="/arena.png";
const fighters=new Image();
fighters.src="/characters/fighters.png";

const salmanAudio=new Audio("/le-re-lund-ke.mp3");
salmanAudio.preload="auto";

function say(t){$("status").textContent=t}
function message(t){$("message").textContent=t||""}

function playFile(file){
 try{
  const a=new Audio(file);
  a.volume=1;
  a.play().catch(()=>{});
 }catch(e){}
}

function sound(freq=150,duration=.12,type="square"){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  const a=new AC();
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(.09,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+duration);
  o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+duration);
  setTimeout(()=>a.close(),duration*1000+100);
 }catch(e){}
}

function playSpecial(){
 const p=gameState?.players?.[mySlot];
 const c=(p?.character||$("character").value||"").toLowerCase();

 if(c.includes("salman")){
  salmanAudio.currentTime=0;
  salmanAudio.play().catch(()=>sound(75,.5,"sawtooth"));
 }else if(c.includes("shah")){
  sound(480,.5,"sawtooth");
 }else{
  sound(85,.7,"sawtooth");
 }
}

if(typeof io==="undefined"){
 say("SOCKET SCRIPT ERROR");
}else{
 socket=io({transports:["polling"],reconnection:true,timeout:20000});

 socket.on("connect",()=>say("● ONLINE"));
 socket.on("connect_error",()=>say("CONNECTION ERROR"));
 socket.on("disconnect",()=>say("● OFFLINE"));

 socket.on("joined",d=>{
  currentCode=d.code;
  mySlot=d.slot;
  $("roomCode").textContent=d.code;
  say("ROOM JOINED • PLAYER "+(d.slot+1));
 });

 socket.on("state",s=>{
  const old=gameState;
  gameState=s;

  if(s.code){
   currentCode=s.code;
   $("roomCode").textContent=s.code;
  }

  if(old?.players&&s.players){
   s.players.forEach((p,i)=>{
    const oldHP=old.players[i]?.hp;
    if(oldHP!==undefined&&p.hp<oldHP){
     speech.push({
      slot:i,
      text:["AYEEEIN?!","BAS KAR BHAI!","KYA MAARTA HAI!","AREY BAAP RE!"][Math.floor(Math.random()*4)],
      life:1
     });
     effects.push({type:"hit",life:1,x:playerX(p),y:playerY(p)-150});
     shake=13;
     sound(100,.13);
    }
   });
  }

  updateHUD();

  if(s.message&&s.message!==lastServerMessage){
   lastServerMessage=s.message;
   message(s.message);
  }

  if(s.winner&&!matchEnded){
   matchEnded=true;
   sound(500,.6,"sawtooth");
  }
 });
}

let lastServerMessage="";

function playerData(){
 const name=$("playerName").value.trim();
 if(!name){say("ENTER YOUR NAME");return null}
 return {name,character:$("character").value};
}

function enterGameMode(){
 const el=document.documentElement;
 if(!document.fullscreenElement&&el.requestFullscreen){
  el.requestFullscreen().then(()=>{
   if(screen.orientation?.lock)screen.orientation.lock("landscape").catch(()=>{});
  }).catch(()=>{});
 }else if(screen.orientation?.lock){
  screen.orientation.lock("landscape").catch(()=>{});
 }
}

function createRoom(){
 const d=playerData();if(!d)return;
 if(!socket||!socket.connected)return say("SERVER NOT CONNECTED");
 socket.emit("createRoom",d);
 say("CREATING ROOM...");
}

function joinRoom(){
 const d=playerData();if(!d)return;
 const code=$("joinCode").value.trim().toUpperCase();
 if(code.length!==6)return say("ENTER VALID ROOM CODE");
 if(!socket||!socket.connected)return say("SERVER NOT CONNECTED");
 socket.emit("joinRoom",{...d,code});
 say("JOINING ROOM...");
}

function startMatch(){
 if(!socket||!socket.connected)return say("SERVER NOT CONNECTED");
 socket.emit("startMatch");
 $("lobby").style.display="none";
}

function action(type){
 if(!socket||!socket.connected)return;
 if(!gameState||!gameState.started)return say("START THE FIGHT FIRST");

 socket.emit("action",type);

 if(type==="punch"){
  effects.push({type:"swing",life:1});
  sound(180,.1);
 }
 if(type==="special"){
  effects.push({type:"special",life:1});
  shake=20;
  playSpecial();
 }
}

function copyCode(){
 if(!currentCode)return say("CREATE A ROOM FIRST");
 if(navigator.clipboard){
  navigator.clipboard.writeText(currentCode).then(()=>say("CODE COPIED")).catch(()=>say("ROOM CODE: "+currentCode));
 }else say("ROOM CODE: "+currentCode);
}

function updateHUD(){
 if(!gameState?.players)return;
 gameState.players.forEach((p,i)=>{
  const n=i+1;
  $("name"+n).textContent=p.name||"PLAYER "+n;
  $("hp"+n).style.width=Math.max(0,p.hp)+"%";
  $("power"+n).style.width=Math.max(0,p.charge)+"%";
 });
 $("roundInfo").textContent=gameState.started?"FIGHT!":"WAITING";
}

$("createBtn").onclick=()=>{enterGameMode();createRoom()};
$("joinBtn").onclick=()=>{enterGameMode();joinRoom()};
$("startBtn").onclick=()=>{enterGameMode();startMatch()};
$("fightBtn").onclick=()=>{enterGameMode();startMatch()};
$("copyBtn").onclick=copyCode;
$("punchBtn").onclick=()=>action("punch");
$("specialBtn").onclick=()=>action("special");
$("menuBtn").onclick=()=>{$("lobby").style.display="block"};
$("closeLobby").onclick=()=>{$("lobby").style.display="none"};

const joy=$("joystick"),stick=$("stick");

function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=(e.clientX-r.left-r.width/2)/(r.width/2);
 let y=(e.clientY-r.top-r.height/2)/(r.height/2);
 const d=Math.hypot(x,y);
 if(d>1){x/=d;y/=d}
 joyX=x;joyY=y;
 const m=r.width*.29;
 stick.style.left=(r.width/2-21+x*m)+"px";
 stick.style.top=(r.height/2-21+y*m)+"px";
}

function stopJoy(){
 joyActive=false;
 joyX=joyY=0;
 stick.style.left="29%";
 stick.style.top="29%";
}

joy.addEventListener("pointerdown",e=>{
 joyActive=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});
joy.addEventListener("pointermove",e=>{if(joyActive)moveJoy(e)});
joy.addEventListener("pointerup",stopJoy);
joy.addEventListener("pointercancel",stopJoy);

setInterval(()=>{
 if(socket&&socket.connected&&mySlot!==null&&gameState?.started&&
 (Math.abs(joyX)>.08||Math.abs(joyY)>.08)){
  socket.emit("move",{dx:joyX,dy:joyY});
 }
},80);

const block=$("blockBtn");
block.addEventListener("pointerdown",e=>{
 e.preventDefault();
 if(socket&&socket.connected&&gameState?.started)socket.emit("action","block");
});
function releaseBlock(e){
 e.preventDefault();
 if(socket&&socket.connected)socket.emit("action","release");
}
block.addEventListener("pointerup",releaseBlock);
block.addEventListener("pointercancel",releaseBlock);
block.addEventListener("pointerleave",e=>{if(e.buttons===0)releaseBlock(e)});

function drawArena(){
 if(arena.complete&&arena.naturalWidth){
  ctx.drawImage(arena,0,0,1280,720);
 }else{
  const g=ctx.createLinearGradient(0,0,0,720);
  g.addColorStop(0,"#101a32");
  g.addColorStop(1,"#030711");
  ctx.fillStyle=g;ctx.fillRect(0,0,1280,720);
  ctx.fillStyle="#151e32";ctx.fillRect(0,300,1280,420);
  ctx.fillStyle="#c99a43";ctx.fillRect(80,300,1120,340);
  ctx.fillStyle="#171b29";ctx.fillRect(95,315,1090,310);
  for(let i=0;i<3;i++){
   ctx.strokeStyle=["#dc263e","#e9d8a4","#246dd0"][i];
   ctx.lineWidth=9;ctx.beginPath();
   ctx.moveTo(95,390+i*65);ctx.lineTo(1185,390+i*65);ctx.stroke();
  }
 }
}

function fighterIndex(p){
 const c=(p.character||"").toLowerCase();
 if(c.includes("shah")||c.includes("srk"))return 1;
 if(c.includes("amitabh")||c.includes("big"))return 2;
 return 0;
}

function playerX(p){return 150+(Number(p.x)||0)*9.8}
function playerY(p){return 350+(Number(p.y)||0)*2.4}

function drawSpeech(){
 speech=speech.filter(e=>e.life>0);
 speech.forEach(e=>{
  e.life-=.012;
  const p=gameState?.players?.[e.slot];
  if(!p)return;
  const x=playerX(p),y=playerY(p)-265;
  ctx.save();
  ctx.globalAlpha=Math.min(1,e.life*2);
  ctx.fillStyle="#fff";
  ctx.strokeStyle="#111";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.roundRect(x-100,y-35,200,48,12);
  ctx.fill();ctx.stroke();
  ctx.fillStyle="#b30c2c";
  ctx.font="bold 21px Arial";
  ctx.textAlign="center";
  ctx.fillText(e.text,x,y-5);
  ctx.restore();
 });
}

function drawFighter(p,slot,now){
 const x=playerX(p),y=playerY(p);
 const idx=fighterIndex(p);
 const phase=now/150+slot*2;
 const bob=Math.sin(phase)*5;
 const moving=slot===mySlot&&(Math.abs(joyX)+Math.abs(joyY)>.1);
 const attacking=!!p.attacking;
 const blocking=!!p.blocking;
 const face=slot===0?1:-1;
 const punch=attacking?Math.sin(now/35)*35:0;

 ctx.save();
 ctx.translate(x,y+bob);
 ctx.scale(face,1);

 ctx.fillStyle="#0009";
 ctx.beginPath();ctx.ellipse(0,8,65,17,0,0,Math.PI*2);ctx.fill();

 if(moving){
  ctx.translate(Math.sin(phase*2)*5,0);
  ctx.rotate(Math.sin(phase*2)*.045);
 }

 if(fighters.complete&&fighters.naturalWidth){
  const sw=fighters.naturalWidth/3;
  ctx.drawImage(fighters,idx*sw,0,sw,fighters.naturalHeight,-85,-240,170,240);
 }else{
  ctx.fillStyle="#dba47d";
  ctx.beginPath();ctx.arc(0,-190,34,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=["#a91f37","#205aab","#57348e"][idx];
  ctx.fillRect(-43,-155,86,115);
  ctx.fillStyle="#222";
  ctx.fillRect(-35,-40,28,45);
  ctx.fillRect(8,-40,28,45);
 }

 if(attacking){
  ctx.strokeStyle="#ffe25a";ctx.lineWidth=17;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(35,-130);ctx.lineTo(105+punch,-140);ctx.stroke();
  ctx.fillStyle="#fff1a1";
  ctx.beginPath();ctx.arc(110+punch,-140,13,0,Math.PI*2);ctx.fill();
 }

 if(blocking){
  ctx.strokeStyle="#4bdcff";ctx.lineWidth=10;
  ctx.beginPath();ctx.arc(0,-130,75,-1.5,1.5);ctx.stroke();
 }

 ctx.restore();

 ctx.fillStyle="#fff";
 ctx.font="bold 19px Arial";
 ctx.textAlign="center";
 ctx.shadowColor="#000";ctx.shadowBlur=7;
 ctx.fillText(p.name||"FIGHTER",x,y+32);
 ctx.shadowBlur=0;
}

function drawEffects(){
 effects=effects.filter(e=>e.life>0);
 effects.forEach(e=>{
  e.life-=.035;
  ctx.save();
  ctx.globalAlpha=Math.max(0,e.life);

  if(e.type==="hit"){
   ctx.fillStyle="#ffe05c";
   ctx.font="bold 65px Arial";
   ctx.textAlign="center";
   ctx.fillText("💥",e.x||640,e.y||310);
  }

  if(e.type==="swing"){
   ctx.strokeStyle="#fff1a0";ctx.lineWidth=12;
   ctx.beginPath();ctx.arc(640,350,100,Math.PI,Math.PI*1.8);ctx.stroke();
  }

  if(e.type==="special"){
   ctx.fillStyle="#ffe04e";
   ctx.font="bold 65px Arial";
   ctx.textAlign="center";
   ctx.fillText("⚡ SUPER POWER ⚡",640,180);
   ctx.strokeStyle="#fff";ctx.lineWidth=8;
   ctx.beginPath();
   ctx.moveTo(640,190);ctx.lineTo(550,420);ctx.lineTo(720,320);
   ctx.stroke();
  }
  ctx.restore();
 });
}

function drawResult(){
 if(!gameState?.players)return;
 const loser=gameState.players.findIndex(p=>p.hp<=0);
 if(loser<0&&!gameState.winner)return;

 const winner=loser===0?1:loser===1?0:-1;
 ctx.save();
 ctx.fillStyle="#000b";ctx.fillRect(0,0,1280,720);
 ctx.textAlign="center";
 ctx.shadowColor="#000";ctx.shadowBlur=20;

 ctx.fillStyle="#ffdc68";
 ctx.font="bold 66px Arial";
 ctx.fillText("VIJAYE PRAPT HUI!",640,300);

 ctx.fillStyle="#ff4057";
 ctx.font="bold 54px Arial";
 ctx.fillText("HAG DIYA!",640,390);

 if(winner>=0){
  ctx.fillStyle="#fff";
  ctx.font="bold 24px Arial";
  ctx.fillText(gameState.players[winner].name+" WINS!",640,455);
 }
 ctx.restore();
}

function render(t){
 const dt=Math.min(40,t-lastTime||16);
 lastTime=t;animTime+=dt;

 ctx.clearRect(0,0,1280,720);
 ctx.save();

 if(shake>0){
  ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  shake*=.86;
  if(shake<.5)shake=0;
 }

 drawArena();

 if(gameState?.players){
  gameState.players.forEach((p,i)=>drawFighter(p,i,t));
  drawSpeech();
 }else{
  ctx.fillStyle="#fff";
  ctx.font="bold 35px Arial";
  ctx.textAlign="center";
  ctx.fillText("ENTER THE RING",640,360);
 }

 drawEffects();
 if(gameState?.players?.some(p=>p.hp<=0)||gameState?.winner)drawResult();

 ctx.restore();
 requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
